name: Ingest EPDK licenses

on:
  # Scheduling now lives on cron-job.org (hits this same endpoint
  # directly, bypassing GitHub Actions' runner pool -- which repeatedly
  # left jobs stuck in "queued" for 6+ minutes without starting). Kept
  # here only as a manual fallback so the two schedulers don't compete
  # for EPDK's rate-limited calls.
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingestion endpoint
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET "https://energy-portal-backend.vercel.app/api/cron/ingest-licenses" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 400 ]; then
            echo "Ingestion request failed"
            exit 1
          fi
