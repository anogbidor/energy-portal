name: Ingest EPDK licenses

on:
  schedule:
    # Every 15 minutes. Unlike the Bayilik endpoints (which need small
    # batches + heavy pacing to survive EPDK's throttle -- see
    # ingestBayilik.ts), the 4 distributor "give me everything" calls in
    # a single run have completed clean with real record counts on every
    # observed run, back-to-back with no artificial delay between them --
    # this endpoint appears to sit under a much more permissive quota.
    # 15 min is a large freshness win over the old 6h interval while
    # staying well under the call volume Bayilik already handles safely
    # at 5-minute granularity.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingestion endpoint
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET "https://energy-portal-backend.vercel.app/api/cron/ingest-licenses" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 400 ]; then
            echo "Ingestion request failed"
            exit 1
          fi
