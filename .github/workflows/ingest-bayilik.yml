name: Ingest EPDK Bayilik (station/dealer) data

on:
  # Scheduling now lives on cron-job.org (hits these same endpoints
  # directly, bypassing GitHub Actions' runner pool -- which repeatedly
  # left jobs stuck in "queued" for 6+ minutes without starting). Kept
  # here only as a manual fallback so the two schedulers don't compete
  # for EPDK's rate-limited calls.
  workflow_dispatch: {}

# Each invocation now only processes a single distributor (see
# ingestBayilik.ts) and normally finishes in a few seconds, so this
# manual fallback advances the cycle by one distributor per market per
# run rather than a full batch -- fine for an emergency/manual trigger,
# since real cycling happens via cron-job.org's per-minute schedule.

jobs:
  ingest-petrol:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger petrol Bayilik call
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 30 \
            -X GET "https://energy-portal-backend.vercel.app/api/cron/ingest-bayilik?market=petrol" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 400 ]; then
            echo "Petrol Bayilik call failed"
            exit 1
          fi

  ingest-lpg:
    runs-on: ubuntu-latest
    needs: ingest-petrol
    steps:
      - name: Trigger lpg Bayilik call
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 30 \
            -X GET "https://energy-portal-backend.vercel.app/api/cron/ingest-bayilik?market=lpg" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 400 ]; then
            echo "LPG Bayilik call failed"
            exit 1
          fi
