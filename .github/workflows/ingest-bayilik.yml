name: Ingest EPDK Bayilik (station/dealer) data

on:
  schedule:
    # Every 5 minutes (GitHub's minimum supported granularity). Each tick
    # only processes a small batch of distributors per market (see
    # ingestBayilik.ts) -- EPDK's sustained rate limit turned out to be
    # much stricter than a single burst-protection window, so this cycles
    # through the full distributor list gradually (roughly an hour or two
    # for a full pass) instead of trying to do it all in one run.
    #
    # Restricted to EPDK's active hours -- 08:00-20:00 Turkey time
    # (UTC+3, no DST), i.e. 05:00-17:00 UTC. Same reasoning as
    # ingest-licenses.yml: EPDK doesn't publish anything overnight, so
    # polling then wastes both EPDK's rate-limit budget and Actions
    # minutes. The extra 17:00 UTC tick catches anything right at the
    # 20:00 TRT cutoff before going quiet until 05:00 UTC.
    - cron: '*/5 5-16 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch: {}

# curl's --max-time below is set just under the API route's own
# maxDuration (290s, see src/pages/api/cron/ingest-bayilik.ts) --
# a 5-call batch with jittered 20-28s gaps between calls can take
# 130-150s+ on its own, so the previous 120s curl timeout was aborting
# connections (curl exit 28) on batches that were still succeeding
# server-side, just not being waited for.

jobs:
  ingest-petrol:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger petrol Bayilik batch
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 280 \
            -X GET "https://energy-portal-backend.vercel.app/api/cron/ingest-bayilik?market=petrol" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 400 ]; then
            echo "Petrol Bayilik batch failed"
            exit 1
          fi

  ingest-lpg:
    runs-on: ubuntu-latest
    needs: ingest-petrol
    steps:
      - name: Trigger lpg Bayilik batch
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 280 \
            -X GET "https://energy-portal-backend.vercel.app/api/cron/ingest-bayilik?market=lpg" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 400 ]; then
            echo "LPG Bayilik batch failed"
            exit 1
          fi
