name: Snapshot price and network history

on:
  # Scheduling now lives on cron-job.org (hits these same endpoints
  # directly, bypassing GitHub Actions' runner pool -- which repeatedly
  # left jobs stuck in "queued" for 6+ minutes without starting). Kept
  # here only as a manual fallback so the two schedulers don't compete
  # for EPDK's rate-limited calls.
  workflow_dispatch: {}

jobs:
  snapshot-prices-petrol:
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot today's petrol bulletin
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 60 \
            -X GET "https://energy-portal-backend.vercel.app/api/cron/snapshot-prices?market=petrol" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 400 ]; then
            echo "Petrol price snapshot failed"
            exit 1
          fi

  snapshot-prices-lpg:
    runs-on: ubuntu-latest
    needs: snapshot-prices-petrol
    steps:
      - name: Snapshot today's LPG bulletin
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 60 \
            -X GET "https://energy-portal-backend.vercel.app/api/cron/snapshot-prices?market=lpg" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 400 ]; then
            echo "LPG price snapshot failed"
            exit 1
          fi

  snapshot-network:
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot today's distributor network sizes
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 120 \
            -X GET "https://energy-portal-backend.vercel.app/api/cron/snapshot-network" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 400 ]; then
            echo "Network snapshot failed"
            exit 1
          fi
